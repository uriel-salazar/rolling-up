<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account &mdash; Rolling Up</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="profile-page">
    <header class="app-topbar">
        <a href="/" class="app-brand">Rolling Up</a>

        <nav class="app-nav" aria-label="Main">
            <a href="/map/">Map</a>
            <a href="/feed/">Spots</a>
            <a href="/profile/">Log in</a>
        </nav>

        <span class="app-topbar-spacer"></span>
    </header>

    <main class="profile-main">
        <h1 class="profile-title">Create account</h1>
        <p id="register-info" class="profile-info">Join Rolling Up to add skate spots.</p>

        <form id="register-form" class="profile-form">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="password2">Confirm password</label>
                <input type="password" id="password2" name="password2" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn-primary">Create account</button>
        </form>

        <p class="profile-info" style="margin-top: 24px; font-size: 0.85rem; text-align: center;">
            Already have an account? <a href="/profile/" style="color: var(--white-color); text-decoration: underline;">Log in</a>
        </p>
        <p class="profile-info" style="font-size: 0.85rem; text-align: center;">
            Or <a href="/auth/google/login/" style="color: var(--white-color); text-decoration: underline;">sign up with Google</a>
        </p>
    </main>

    <script>
        const API_URL = '';

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            const info = document.getElementById('register-info');

            if (password !== password2) {
                info.textContent = 'Passwords do not match.';
                info.style.color = '#d9a066';
                return;
            }

            if (password.length < 8) {
                info.textContent = 'Password must be at least 8 characters.';
                info.style.color = '#d9a066';
                return;
            }

            info.textContent = 'Creating account...';
            info.style.color = '#f5f5f5';

            const res = await fetch(`${API_URL}/api/users/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password }),
            });

            if (res.ok) {
                info.textContent = 'Account created. Log in below.';
                info.style.color = '#f5f5f5';
                document.getElementById('register-form').reset();

                const next = new URLSearchParams(window.location.search).get('next');
                setTimeout(() => {
                    window.location.href = next || '/profile/';
                }, 1200);
            } else {
                let detail = 'Could not create account.';
                try {
                    const data = await res.json();
                    detail = data.detail || data.username || data.email || data.password || detail;
                } catch {}
                info.textContent = detail;
                info.style.color = '#d9a066';
            }
        });
    </script>
</body>
</html>
