<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile &mdash; Rolling Up</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="profile-page">
    <header class="app-topbar">
        <a href="/" class="app-brand">Rolling Up</a>

        <nav class="app-nav" aria-label="Main">
            <a href="/map/">Map</a>
            <a href="/feed/">Spots</a>
            <a href="/profile/" aria-current="page">Profile</a>
        </nav>

        <span class="app-topbar-spacer"></span>

        <a href="/spots/new/" class="app-add">Add spot</a>
    </header>

    <main class="profile-main">
        <h1 class="profile-title">Profile</h1>
        <p id="profile-info" class="profile-info">Log in to see your profile.</p>

        <form id="login-form" class="profile-form">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary">Log in</button>
        </form>
    </main>

    <script>
        // The API is on the same host as the page.
        const API_URL = '';

        async function loadProfile() {
            const token = localStorage.getItem('access');
            if (!token) return;

            const res = await fetch(`${API_URL}/api/users/?limit=1`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!res.ok) { localStorage.removeItem('access'); return; }

            const data = await res.json();
            const user = data.results[0];
            document.getElementById('profile-info').textContent =
                `Logged in as ${user.username}`;
            document.getElementById('login-form').style.display = 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(`${API_URL}/api/token/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            if (res.ok) {
                const { access, refresh } = await res.json();
                localStorage.setItem('access', access);
                localStorage.setItem('refresh', refresh);
                await loadProfile();

                // Send the user back to the page they asked for, the
                // spot form redirects here when the session is missing.
                const next = new URLSearchParams(window.location.search).get('next');
                window.location.href = next || '/profile/';
            } else {
                alert('Wrong username or password');
            }
        });

        loadProfile();
    </script>
</body>
</html>
