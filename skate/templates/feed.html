{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spots &mdash; Rolling Up</title>
    <meta name="description" content="The skate spots of Rolling Up: skateparks, street spots and DIY spots.">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'feed.css' %}">
</head>
<body class="feed-page">
    <header class="app-topbar">
        <a href="/" class="app-brand">Rolling Up</a>

        <nav class="app-nav" aria-label="Main">
            <a href="/map/">Map</a>
            <a href="/feed/" aria-current="page">Spots</a>
            <a href="/profile/">Profile</a>
        </nav>

        <span class="app-topbar-spacer"></span>

        <a href="/spots/new/" class="app-add">Add spot</a>
    </header>

    <main class="feed-main">
        <section class="feed-intro">
            <div class="feed-intro-text">
                <h1 class="feed-title">Explore spots</h1>
                <p class="feed-subtitle">
                    Skateparks, street spots and DIY spots. The places that
                    make the city roll.
                </p>
            </div>

            <div class="feed-search">
                <label class="visually-hidden" for="feed-search">Search the spots</label>
                <input type="search" id="feed-search" autocomplete="off"
                       placeholder="Search by name or description">
                <button type="button" id="feed-search-clear" class="feed-search-clear"
                        aria-label="Clear the search" hidden>&times;</button>
            </div>
        </section>

        <p class="feed-count" id="feed-count"></p>

        <section class="feed-grid" id="feed-grid" aria-label="Skate spots"
                 aria-busy="true"></section>
    </main>

    <script src="{% static 'api.js' %}"></script>
    <script src="{% static 'feed.js' %}"></script>
</body>
</html>
